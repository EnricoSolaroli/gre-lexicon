<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GRE Lexicon">
<meta name="theme-color" content="#0B0C0E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>GRE Lexicon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: una colonna da telefono (max 520px), schede antracite su fondo quasi nero, tab bar fissa in basso. Stessa impronta di Elevate (tema scuro scelto di proposito). */
:root{
  --bg:#0B0C0E; --card:#16181C; --raised:#1F2228; --sep:rgba(255,255,255,.08); --track:rgba(255,255,255,.08);
  --fg:#F2F3F5; --fg2:#A3A8B1; --fg3:#6B717C;
  --accent:#4D7BFF; --accent-soft:rgba(77,123,255,.16);
  --goal:#FF9F43; --mastery:#3EE6A8; --streak:#9A8CFF; --bad:#FF6B6B;
  --goal-soft:rgba(255,159,67,.15); --mastery-soft:rgba(62,230,168,.14); --streak-soft:rgba(154,140,255,.16); --bad-soft:rgba(255,107,107,.15);
  --bar:rgba(11,12,14,.88);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --read:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.eyebrow{font-size:13px;font-weight:600;color:var(--fg2);text-transform:capitalize}
h1{margin:2px 0 0;font-size:32px;font-weight:700;letter-spacing:-.02em}
h2.sec{margin:10px 0 -4px;font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
h2.sec small{font-size:13px;font-weight:500;color:var(--fg2)}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--fg2)}
.icon-btn svg{width:20px;height:20px}
.card{background:var(--card);border-radius:20px;padding:16px;width:100%}
.muted{color:var(--fg2)}
.tnum{font-variant-numeric:tabular-nums}

/* Rings */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:18px 8px 14px}
.ring-btn{display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:14px;padding:4px 0}
.ring-wrap{position:relative;width:92px;height:92px;max-width:100%}
.ring-wrap svg{display:block;width:100%;height:100%}
.ring-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.ring-val small{font-size:11px;font-weight:600;color:var(--fg2);margin-top:3px}
.ring-lbl{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.coach{margin:0;font-size:15px;color:var(--fg2);padding:0 4px;text-wrap:pretty}
.coach b{color:var(--fg);font-weight:600}

/* CTA */
.cta{display:flex;align-items:center;gap:14px;padding:16px;background:var(--accent);color:#fff;border-radius:20px;width:100%}
.cta .ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.cta .ic svg{width:22px;height:22px}
.cta .t{font-weight:700;font-size:17px}
.cta .s{font-size:13px;opacity:.85}
.cta .chev{margin-left:auto;opacity:.8}
.cta[disabled]{background:var(--card);color:var(--fg2);cursor:default}
.row-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:var(--card);border-radius:16px}
.row-btn .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.row-btn .ic svg{width:19px;height:19px}
.row-btn .t{font-weight:600;font-size:15px}
.row-btn .s{font-size:13px;color:var(--fg2)}
.row-btn .chev{margin-left:auto;color:var(--fg3);flex:none}
.row-btn[disabled]{opacity:.45;cursor:default}
.stack{display:flex;flex-direction:column;gap:8px}

/* Monitor tiles */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{font-size:12px;font-weight:600;color:var(--fg2);line-height:1.2}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1}
.tile .v small{font-size:13px;font-weight:600;color:var(--fg2)}
.tile .pill{align-self:flex-start}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-new{background:var(--raised);color:var(--fg2)}
.p-learning{background:var(--goal-soft);color:var(--goal)}
.p-review{background:var(--accent-soft);color:#86A6FF}
.p-mastered{background:var(--mastery-soft);color:var(--mastery)}
.p-bad{background:var(--bad-soft);color:var(--bad)}

/* Chart */
.chart svg{display:block;width:100%;height:auto}
.chart-cap{display:flex;justify-content:space-between;font-size:13px;color:var(--fg2);margin-bottom:8px}
.chart-cap b{color:var(--fg);font-variant-numeric:tabular-nums}

/* Word of the day */
.wotd{display:flex;flex-direction:column;gap:6px;text-align:left}
.wotd .w{font-family:var(--read);font-size:30px;font-weight:500;letter-spacing:-.01em;line-height:1.1}
.wotd .d{font-size:15px;color:var(--fg2)}
.pron{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--fg2)}
.pron .resp{font-weight:600;color:var(--fg);letter-spacing:.02em}
.speak{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:#86A6FF;display:inline-grid;place-items:center;flex:none}
.speak svg{width:17px;height:17px}

/* Word list */
.wlist{background:var(--card);border-radius:20px;overflow:hidden}
.witem{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;border-top:1px solid var(--sep)}
.witem:first-child{border-top:0}
.witem .main{min-width:0;flex:1}
.witem .w{font-family:var(--read);font-size:19px;font-weight:500}
.witem .w em{font-family:var(--ui);font-style:normal;font-size:12px;color:var(--fg3);margin-left:6px;font-weight:500}
.witem .it{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.witem .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.witem .nx{font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums}
.empty{padding:18px 16px;color:var(--fg2);font-size:14px}

/* Search + chips */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--fg3);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;padding:12px 0;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:var(--fg2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

/* Segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--raised);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:8px 4px;border-radius:9px;text-align:center;font-size:14px;font-weight:600;color:var(--fg2);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.set-row{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--sep)}
.set-row:first-of-type{border-top:0}
.set-row .lbl{font-weight:600;font-size:15px}
.set-row .hint{font-size:13px;color:var(--fg2)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:51px;height:31px;border-radius:999px;background:var(--raised);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--mastery)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.danger{width:100%;padding:13px;border-radius:14px;background:var(--bad-soft);color:var(--bad);font-weight:600;text-align:center}

/* Mode cards (quiz) */
.mode{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--card);border-radius:20px;width:100%;border:2px solid transparent}
.mode[aria-pressed="true"]{border-color:var(--accent)}
.mode .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mode .t{font-weight:700;font-size:16px}
.mode .s{font-size:14px;color:var(--fg2)}
.mode .ex{font-family:var(--read);font-size:15px;color:var(--fg2);border-left:2px solid var(--sep);padding-left:10px;margin-top:4px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--fg3)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;margin-left:22px;margin-top:-2px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.tab .ico{position:relative;display:flex}

/* Full-screen overlay (study / quiz) */
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-in{max-width:520px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column}
.ov-head{display:flex;align-items:center;gap:12px;padding:4px 0 8px}
.pbar{flex:1;height:6px;border-radius:999px;background:var(--track);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.count{font-size:13px;font-weight:600;color:var(--fg2);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}

/* Flashcard */
.stage{flex:1;min-height:0;display:flex;padding:8px 0 12px}
.fc{flex:1;position:relative;perspective:1400px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.fc-move{position:absolute;inset:0;transition:transform .25s ease}
.fc-move.drag{transition:none}
.fc-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--card);border:1px solid var(--sep);padding:22px 20px;display:flex;flex-direction:column}
.front{align-items:center;justify-content:center;text-align:center;gap:14px}
.front .w{font-family:var(--read);font-size:clamp(38px,11vw,52px);font-weight:500;letter-spacing:-.015em;line-height:1.05;overflow-wrap:anywhere}
.front .pron{justify-content:center}
.front .tap{position:absolute;bottom:18px;left:0;right:0;font-size:13px;color:var(--fg3)}
.front .pill{position:absolute;top:18px;left:18px}
.front .pos{position:absolute;top:18px;right:18px;font-size:13px;color:var(--fg3);font-style:italic;font-family:var(--read)}
.back{transform:rotateY(180deg);overflow-y:auto;gap:14px;-webkit-overflow-scrolling:touch}
.back .hd{display:flex;align-items:center;gap:10px}
.back .hd .w{font-family:var(--read);font-size:28px;font-weight:500;line-height:1.1}
.back .hd .pos{font-family:var(--read);font-style:italic;color:var(--fg3);font-size:15px}
.back .hd .speak{margin-left:auto}
.def{font-size:17px;line-height:1.45}
.blk{display:flex;flex-direction:column;gap:6px}
.blk .lb{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px}
.t-syn{background:var(--mastery-soft);color:var(--mastery)}
.t-ant{background:var(--bad-soft);color:var(--bad)}
.ex{font-family:var(--read);font-size:18px;line-height:1.5;margin:0}
.ex mark{background:none;color:#86A6FF;font-weight:600}
.it-box{background:var(--raised);border-radius:14px;padding:10px 12px;font-size:15px}
.it-toggle{font-size:14px;font-weight:600;color:#86A6FF;align-self:flex-start;padding:4px 0}
.swipe-tag{position:absolute;top:22px;z-index:3;padding:6px 12px;border-radius:10px;font-weight:800;font-size:15px;letter-spacing:.04em;border:2px solid currentColor;opacity:0;pointer-events:none}
.swipe-tag.l{right:22px;color:var(--bad);transform:rotate(8deg)}
.swipe-tag.r{left:22px;color:var(--mastery);transform:rotate(-8deg)}
.controls{display:flex;flex-direction:column;gap:8px}
.big-btn{width:100%;padding:16px;border-radius:16px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;text-align:center}
.big-btn.sec{background:var(--card);color:var(--fg)}
.big-btn[disabled]{background:var(--card);color:var(--fg3);cursor:default}
.rate-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:16px;background:var(--card);text-align:center}
.rate .t{font-weight:700;font-size:15px}
.rate .s{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.rate.again{background:var(--bad-soft)} .rate.again .t{color:var(--bad)}
.rate.hard{background:var(--goal-soft)} .rate.hard .t{color:var(--goal)}
.rate.easy{background:var(--mastery-soft)} .rate.easy .t{color:var(--mastery)}
.hint-line{text-align:center;font-size:12px;color:var(--fg3)}

/* Quiz */
.q-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:6px 0 12px}
.q-type{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#86A6FF}
.q-instr{font-size:14px;color:var(--fg2);margin:-6px 0 0}
.q-text{font-family:var(--read);font-size:20px;line-height:1.55;background:var(--card);border-radius:18px;padding:18px;margin:0}
.blank{display:inline-block;min-width:5.2em;border-bottom:2px solid var(--fg2);height:1.1em;vertical-align:-2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--card);border:2px solid transparent;width:100%}
.opt .let{width:28px;height:28px;border-radius:8px;background:var(--raised);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--fg2);flex:none}
.opt.se .let{border-radius:6px}
.opt .ow{font-family:var(--read);font-size:18px}
.opt[aria-pressed="true"]{border-color:var(--accent)}
.opt[aria-pressed="true"] .let{background:var(--accent);color:#fff}
.opt.ok{border-color:var(--mastery);background:var(--mastery-soft)}
.opt.ok .let{background:var(--mastery);color:#0B0C0E}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .let{background:var(--bad);color:#0B0C0E}
.opt[disabled]{cursor:default}
.fb{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fb .res{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.fb .res.good{color:var(--mastery)} .fb .res.bad{color:var(--bad)}
.fb .ex{font-size:17px}

/* Results */
.result{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:12px 0}
.result h2{margin:0;font-size:26px;font-weight:700}
.result p{margin:0;color:var(--fg2);max-width:34ch}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
.grab{width:38px;height:5px;border-radius:999px;background:var(--raised);align-self:center}
.sheet h3{margin:0;font-size:20px}
.sheet .sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet .close{width:32px;height:32px;border-radius:50%;background:var(--raised);display:grid;place-items:center;color:var(--fg2)}
.sheet .back-like{display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kv div{background:var(--raised);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:11px;color:var(--fg2);font-weight:600}
.kv b{font-size:15px;font-variant-numeric:tabular-nums}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--raised);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fade .2s;max-width:calc(100% - 32px)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app"></div>
<nav class="tabbar" aria-label="Sezioni"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>

/* ---------- Modello delle schede (ripetizione dilazionata) ---------- */
const blank = () => ({ease:2.5, interval:0, reps:0, lapses:0, due:0, seen:false, last:0});
const getC = w => S.cards[w] || blank();

const isDue = w => { const c = S.cards[w]; return !!c && c.seen && c.due <= Date.now(); };
function level(w){
  const c = S.cards[w];
  if (!c || !c.seen) return 'new';
  if (c.interval >= 21) return 'mastered';
  if (c.interval >= 7) return 'review';
  return 'learning';
}
const LEVEL = {new:['Nuova','p-new'], learning:['In apprendimento','p-learning'], review:['Consolidata','p-review'], mastered:['Padroneggiata','p-mastered']};
const pill = w => { const [t,c] = LEVEL[level(w)]; return `<span class="pill ${c}">${t}</span>`; };
function day(){ return (S.days[todayKey()] ||= {r:0, ok:0, q:0, qok:0, n:0}); }

/* Esito di una valutazione: o la carta torna in coda in questa sessione (now), o riceve un nuovo intervallo in giorni (iv). */
function outcome(c, st, r){
  if (r === 'again') return {now:true};
  if (r === 'hard' && st.h === 0 && (st.f > 0 || c.interval === 0)) return {now:true};
  let iv;
  if (r === 'hard') iv = c.interval === 0 ? 1 : Math.max(c.interval + 1, Math.round(c.interval * 1.2));
  else if (st.f > 0) iv = 1;
  else if (c.interval === 0) iv = st.h > 0 ? 1 : (c.reps === 0 && c.lapses === 0 ? 4 : 2);
  else iv = Math.round(c.interval * c.ease);
  return {iv: clamp(iv, 1, 365)};
}
function finalize(c, r, st){
  const o = outcome(c, st, r);
  if (r === 'hard' && st.h === 0) c.ease = Math.max(1.3, c.ease - 0.15);
  if (r === 'easy' && st.f === 0 && st.h === 0 && c.interval > 0) c.ease = Math.min(3, c.ease + 0.1);
  c.interval = o.iv; c.reps++; c.due = startOfToday() + o.iv * DAY;
}
const fmtIv = n => n === 1 ? 'domani' : n < 30 ? `tra ${n} g` : n < 365 ? `tra ${Math.round(n/30)} mesi` : 'tra 1 anno';
function nextLabel(w){
  const c = S.cards[w];
  if (!c || !c.seen) return '—';
  if (c.due <= Date.now()) return 'da ripassare';
  const d = Math.round((c.due - startOfToday()) / DAY);
  return d <= 1 ? 'domani' : `tra ${d} g`;
}

/* ---------- Statistiche ---------- */
function streak(){
  const met = k => { const d = S.days[k]; return !!d && (d.met || d.r >= S.settings.goal); };
  const t = new Date(); let n = 0;
  if (!met(keyOf(t))) t.setDate(t.getDate() - 1);
  while (met(keyOf(t))) { n++; t.setDate(t.getDate() - 1); }
  return n;
}
function stats(){
  let due = 0, seen = 0, mastered = 0, learning = 0, review = 0;
  for (const o of WORDS) {
    const l = level(o.w);
    if (l !== 'new') seen++;
    if (l === 'mastered') mastered++; else if (l === 'learning') learning++; else if (l === 'review') review++;
    if (isDue(o.w)) due++;
  }
  const d = day();
  const newLeft = Math.min(Math.max(0, S.settings.newPerDay - d.n), WORDS.length - seen);
  let r7 = 0, ok7 = 0;
  for (let i = 0; i < 7; i++) { const t = new Date(); t.setDate(t.getDate() - i); const x = S.days[keyOf(t)]; if (x) { r7 += x.r; ok7 += x.ok; } }
  return {due, seen, mastered, learning, review, newLeft, unseen: WORDS.length - seen, total: WORDS.length, acc: r7 ? Math.round(ok7 / r7 * 100) : null, r7};
}

}

  if (st.newLeft) return `Niente in scadenza. Oggi puoi aggiungere <b>${st.newLeft} parole nuove</b> al tuo lessico.`;
  if (st.unseen === 0 && st.seen) return 'Hai visto tutte le parole del mazzo. Ora il lavoro è farle arrivare a «padroneggiata» con quiz e ripassi.';
  return 'Sei in pari con ripassi e parole nuove. Prova un quiz Text Completion per testare il lessico nel contesto.';

function weekChart(){
  const g = S.settings.goal, days = [];
  for (let i = 6; i >= 0; i--) { const t = new Date(); t.setDate(t.getDate() - i); const x = S.days[keyOf(t)] || {r:0}; days.push({lbl:'DLMMGVS'[t.getDay()], v:x.r, today:i===0}); }
  const max = Math.max(g, ...days.map(d => d.v)) * 1.1, W = 320, H = 130, top = 10, base = 106, bw = 26, step = W / 7;
  const y = v => base - (v / max) * (base - top);
  const bars = days.map((d, i) => {
    const x = i * step + (step - bw) / 2, h = Math.max(d.v ? 3 : 0, base - y(d.v));
    const col = d.v >= g ? 'var(--goal)' : 'rgba(255,159,67,.45)';
    return `<rect x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="6" fill="${col}"/>`+
      `<text x="${(x + bw/2).toFixed(1)}" y="${base + 18}" text-anchor="middle" font-size="12" font-weight="${d.today?700:500}" fill="${d.today?'var(--fg)':'var(--fg3)'}">${d.lbl}</text>`+
      (d.v ? `<text x="${(x + bw/2).toFixed(1)}" y="${(base - h - 5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fg2)">${d.v}</text>` : '');
  }).join('');
  const gy = y(g).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Risposte negli ultimi 7 giorni"><line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--sep)"/><line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--fg3)" stroke-dasharray="4 4"/>${bars}</svg>`;
}

/* ---------- Sessione flashcard ---------- */
let sess = null;
function buildQueue(kind, list){
  const len = S.settings.sessionLen;
  if (kind === 'list') return list.slice();
  if (kind === 'hard') return hardWords().slice(0, len).map(o => o.w);
  if (kind === 'ahead') return WORDS.filter(o => { const c = S.cards[o.w]; return c && c.seen && c.due > Date.now(); }).sort((a,b) => getC(a.w).due - getC(b.w).due).slice(0, len).map(o => o.w);
  const fresh = FRESH_ORDER.filter(o => !getC(o.w).seen).map(o => o.w);
  if (kind === 'more') return fresh.slice(0, 5);
  const due = WORDS.filter(o => isDue(o.w)).sort((a,b) => getC(a.w).due - getC(b.w).due).map(o => o.w);
  const nw = fresh.slice(0, stats().newLeft);
  const q = [];
  while (q.length < len && (due.length || nw.length)) {
    for (let i = 0; i < 2 && due.length && q.length < len; i++) q.push(due.shift());
    if (nw.length && q.length < len) q.push(nw.shift());
  }
  return q;
}
function startStudy(kind, list){
  const q = buildQueue(kind, list);
  if (!q.length) { toast('Nessuna carta per questa modalità'); return; }
  closeSheet();
  sess = {queue:q, total:q.length, done:new Set(), st:{}, count:{again:0, hard:0, easy:0}, cur:null, flipped:false, showIt:S.settings.showIt};
  nextCard();
}
function nextCard(){
  if (!sess.queue.length) return finishStudy();
  sess.cur = sess.queue.shift(); sess.flipped = false; sess.showIt = S.settings.showIt;
  renderStudyScreen();
}
function backFace(o, showIt){

    ${o.syn.length ? `<div class="blk"><span class="lb">Sinonimi</span><div class="tags">${o.syn.map(s => `<span class="tag t-syn">${esc(s)}</span>`).join('')}</div></div>` : ''}

function controlsHtml(){
  const c = getC(sess.cur), st = sess.st[sess.cur] || {f:0, h:0};
  const lbl = r => { const x = outcome(c, st, r); return x.now ? (r === 'again' ? 'tra 3 carte' : 'più tardi') : fmtIv(x.iv); };
  return sess.flipped ? `
      <div class="rate-row">
        <button class="rate again" data-rate="again"><span class="t">Non la so</span><span class="s">${lbl('again')}</span></button>

      `<button class="big-btn" data-act="flip">Mostra il significato</button><div class="hint-line">Prova a ricordare definizione e un sinonimo prima di girare</div>`;
}
function flip(){
  if (!sess) return;
  sess.flipped = !sess.flipped;
  $('#fc').classList.toggle('flipped', sess.flipped);
  if (sess.flipped) { const scroll = $('#back'); if (scroll) scroll.scrollTop = 0; }
  $('#ctrl').innerHTML = controlsHtml();
}
function rate(r){
  if (!sess || !sess.flipped) return;
  const w = sess.cur, c = ensure(w), st = (sess.st[w] ||= {f:0, h:0}), d = day(), now = Date.now();
  if (!c.seen) { c.seen = true; d.n++; }
  d.r++; if (r !== 'again') d.ok++;
  if (d.r >= S.settings.goal) d.met = true;
  sess.count[r]++; c.last = now;
  const o = outcome(c, st, r);
  if (r === 'again') {
    if (c.interval > 0) c.lapses++;
    c.ease = Math.max(1.3, c.ease - 0.2); c.interval = 0; c.reps = 0; c.due = now; st.f++;
    sess.queue.splice(Math.min(3, sess.queue.length), 0, w);
  } else if (o.now) {
    c.ease = Math.max(1.3, c.ease - 0.15); c.due = now; st.h++;
    sess.queue.splice(Math.min(6, sess.queue.length), 0, w);
  } else {
    finalize(c, r, st); sess.done.add(w);
  }
  save();
  const m = $('#fcm');
  if (m && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    m.classList.remove('drag');
    m.style.transform = `translateX(${r === 'again' ? -120 : r === 'easy' ? 120 : 0}%) translateY(${r === 'hard' ? -30 : 0}px) rotate(${r === 'again' ? -12 : r === 'easy' ? 12 : 0}deg)`;
    m.style.opacity = '0';
    setTimeout(nextCard, 220);
  } else nextCard();
}
function bindSwipe(){
  const fc = $('#fc'), m = $('#fcm'); if (!fc) return;
  let x0 = 0, y0 = 0, dx = 0, active = false, moved = false;
  fc.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    active = true; moved = false; x0 = e.clientX; y0 = e.clientY; dx = 0;
  });
  fc.addEventListener('pointermove', e => {
    if (!active) return;
    dx = e.clientX - x0; const dy = e.clientY - y0;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
    if (!sess.flipped || Math.abs(dx) < Math.abs(dy)) return;
    try { fc.setPointerCapture(e.pointerId); } catch(_) {}
    m.classList.add('drag');
    m.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
    $('#tagR').style.opacity = clamp(dx / 90, 0, 1);
    $('#tagL').style.opacity = clamp(-dx / 90, 0, 1);
  });
  const end = () => {
    if (!active) return; active = false;
    if (!moved) { flip(); return; }
    if (sess.flipped && Math.abs(dx) > 90) { rate(dx > 0 ? 'easy' : 'again'); return; }
    m.classList.remove('drag'); m.style.transform = '';
    $('#tagR').style.opacity = 0; $('#tagL').style.opacity = 0;
  };
  fc.addEventListener('pointerup', end);
  fc.addEventListener('pointercancel', () => { active = false; m.classList.remove('drag'); m.style.transform = ''; });
}
function finishStudy(){

/* ---------- Quiz ---------- */
const QT = {
  tc: {name:'Text Completion', instr:'Scegli la parola che completa meglio la frase.'},
  se: {name:'Sentence Equivalence', instr:'Scegli le DUE parole che completano la frase e le danno lo stesso significato.'},
  def:{name:'Definizione', instr:'Quale parola corrisponde a questa definizione?'}
};
function related(a, b){
  if (a.syn.includes(b.w) || b.syn.includes(a.w) || a.x.includes(b.w) || b.x.includes(a.w)) return true;
  return a.syn.some(s => b.syn.includes(s));
}
function makeQ(o, type){
  const pool = WORDS.filter(x => x !== o && x.pos === o.pos && !related(o, x));
  if (type === 'se') {
    const s = o.syn.find(x => /^[a-z]+$/i.test(x) && !BY[x]) || o.syn.find(x => /^[a-z-]+$/i.test(x));
    if (!s) return makeQ(o, 'tc');
    const p2 = pool.filter(x => !x.syn.includes(s));
    const d = pick(p2, 4).map(x => x.w);
    if (d.length < 4) return makeQ(o, 'tc');
    return {type, w:o.w, opts:shuffle([o.w, s, ...d]), correct:[o.w, s], sel:[], done:false};
  }
  const d = pick(pool, 4).map(x => x.w);
  return {type, w:o.w, opts:shuffle([o.w, ...d]), correct:[o.w], sel:[], done:false};
}
function chooseTargets(n, list){
  if (list && list.length) return shuffle(list).slice(0, n).map(w => BY[w]);
  const seen = WORDS.filter(o => getC(o.w).seen);
  const base = seen.length >= n ? seen : WORDS;
  const items = base.map(o => { const c = getC(o.w); return {o, wt: 1 + c.lapses * 2 + (c.seen && c.interval < 7 ? 2 : 0) + (isDue(o.w) ? 2 : 0) + (c.ease < 2.3 ? 1 : 0)}; });
  const out = [];
  while (out.length < n && items.length) {
    let t = Math.random() * items.reduce((s, i) => s + i.wt, 0), k = 0;
    while ((t -= items[k].wt) > 0) k++;
    out.push(items.splice(k, 1)[0].o);
  }
  return out;
}
let qz = null;
function startQuiz(mode, n, list){
  closeSheet();
  const types = mode === 'mix' ? ['tc','tc','se','def'] : [mode];
  const qs = chooseTargets(n, list).map(o => makeQ(o, types[Math.floor(Math.random() * types.length)]));
  if (!qs.length) return;
  qz = {mode, qs, i:0, score:0};
  renderQ();
}
const blankify = ex => esc(ex).replace(/\b(a|an|A|An) \*/g, (m, a) => (a[0] === 'A' ? 'A' : 'a') + '(n) *').replace(/\*[^*]+\*/, '<span class="blank" aria-label="spazio vuoto"></span>');
function renderQ(){
  const q = qz.qs[qz.i], o = BY[q.w], t = QT[q.type];
  const L = 'ABCDEF';
  const optCls = w => !q.done ? '' : q.correct.includes(w) ? 'ok' : q.sel.includes(w) ? 'no' : '';
  const isOk = q.done && q.sel.length === q.correct.length && q.sel.every(s => q.correct.includes(s));
  $('#layer').innerHTML = `
  <div class="ov"><div class="ov-in">
    <div class="ov-head"><button class="icon-btn" data-act="close-quiz" aria-label="Chiudi quiz">${I.x}</button><div class="pbar"><i style="width:${(qz.i + (q.done?1:0)) / qz.qs.length * 100}%"></i></div><span class="count">${qz.i + 1}/${qz.qs.length}</span></div>
    <div class="q-scroll" id="qs">
      <div class="q-type">${t.name}</div>
      <p class="q-instr">${t.instr}</p>
      <p class="q-text">${q.type === 'def' ? esc(o.def) : blankify(o.ex)}</p>
      <div class="opts">${q.opts.map((w, i) => `<button class="opt ${q.type==='se'?'se':''} ${optCls(w)}" data-opt="${esc(w)}" aria-pressed="${q.sel.includes(w)}" ${q.done?'disabled':''}><span class="let">${L[i]}</span><span class="ow">${esc(w)}</span></button>`).join('')}</div>
      ${q.done ? `<div class="fb">
        <div class="res ${isOk?'good':'bad'}">${isOk ? 'Corretto' : 'Non esatto'}${isOk ? '' : ` · ${q.correct.map(esc).join(' + ')}`}</div>
        <div class="hd" style="display:flex;align-items:center;gap:10px"><button data-word="${o.w}" style="font-family:var(--read);font-size:24px;font-weight:500">${o.w}</button><span class="muted" style="font-size:14px">${o.resp}</span>${speakBtn(o.w)}</div>
        <div style="font-size:15px">${esc(o.def)}</div>
        <div class="it-box">🇮🇹 ${esc(o.it)}</div>
        ${q.type !== 'def' ? `<p class="ex">${markEx(o.ex)}</p>` : ''}
        ${q.type === 'se' ? `<div class="muted" style="font-size:13px">In Sentence Equivalence servono entrambe le parole giuste: una sola non dà punti.</div>` : ''}
      </div>` : ''}
    </div>
    <div class="controls">${q.done
      ? `<button class="big-btn" data-act="q-next">${qz.i + 1 < qz.qs.length ? 'Avanti' : 'Vedi il risultato'}</button>`
      : q.type === 'se' ? `<button class="big-btn" data-act="q-check" ${q.sel.length === 2 ? '' : 'disabled'}>${q.sel.length === 2 ? 'Verifica' : `Seleziona ${2 - q.sel.length} ${2 - q.sel.length === 1 ? 'parola' : 'parole'}`}</button>` : ''}</div>
  </div></div>`;
}
function answerQ(){
  const q = qz.qs[qz.i];
  q.done = true;
  const ok = q.sel.length === q.correct.length && q.sel.every(s => q.correct.includes(s));
  if (ok) qz.score++;
  const c = ensure(q.w), d = day(), now = Date.now();
  d.r++; d.q++; if (ok) { d.ok++; d.qok++; }
  if (d.r >= S.settings.goal) d.met = true;
  if (ok) { if (!c.seen || c.interval === 0 || c.due <= now) { c.seen = true; finalize(c, 'easy', {f:0, h:0}); } }
  else { c.seen = true; if (c.interval > 0) c.lapses++; else c.lapses = Math.max(c.lapses, 1); c.ease = Math.max(1.3, c.ease - 0.2); c.interval = 0; c.reps = 0; c.due = now; }
  c.last = now; q.ok = ok;
  save(); renderQ();
  const fb = document.querySelector('.fb'); if (fb) fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function finishQuiz(){
  const n = qz.qs.length, s = qz.score, miss = qz.qs.filter(q => !q.ok).map(q => q.w);
  S.quizzes = [{t:Date.now(), mode:qz.mode, s, n}, ...(S.quizzes || [])].slice(0, 12); save();
  const msg = s === n ? 'Tutte giuste. Queste parole si allontanano nel calendario dei ripassi.' : s / n >= .7 ? 'Buon risultato. Le parole sbagliate tornano nel ripasso di oggi.' : 'Le parole sbagliate sono già in coda per il ripasso: ripassale subito finché sono fresche.';
  $('#layer').innerHTML = `
  <div class="ov"><div class="ov-in" style="gap:16px;overflow-y:auto">
    <div class="result" style="padding-top:20px">
      <div class="ring-wrap" style="width:120px;height:120px">${ring(s / n, s / n >= .7 ? 'var(--mastery)' : 'var(--goal)', 120, 12)}<div class="ring-val" style="font-size:30px">${s}<small>su ${n}</small></div></div>
      <h2>${Math.round(s / n * 100)}% corrette</h2><p>${msg}</p>
    </div>
    ${miss.length ? `<h2 class="sec">Da rivedere</h2><div class="wlist">${miss.map(w => wordRow(BY[w], '<span class="pill p-bad">sbagliata</span>')).join('')}</div>` : ''}
    <div class="stack" style="margin-top:auto">
      ${miss.length ? `<button class="big-btn" data-act="study-list" data-words="${miss.join(',')}">Ripassa ora gli errori</button>` : ''}
      <button class="big-btn ${miss.length ? 'sec' : ''}" data-act="close-quiz">Torna all'app</button>
    </div>
  </div></div>`;
  qz = null;
}
function renderQuiz(){
  const modes = [
    ['tc', QT.tc.name, 'Una frase con uno spazio vuoto e cinque opzioni, come nella sezione Verbal.', 'The results were ______: some patients improved, but just as many showed no change.'],
    ['se', QT.se.name, 'Sei opzioni, due risposte giuste che producono frasi equivalenti.', 'Scegli due parole: entrambe devono funzionare e significare la stessa cosa.'],
    ['def', QT.def.name, 'Dalla definizione inglese alla parola. Utile per fissare il significato.', ''],
    ['mix', 'Misto', 'Text Completion, Sentence Equivalence e definizioni insieme.', '']
  ];
  const st = stats();
  const hist = (S.quizzes || []).slice(0, 5);
  return `
  <header class="top"><div><div class="eyebrow">Verbal Reasoning</div><h1>Quiz</h1></div><button class="icon-btn" data-act="settings" aria-label="Impostazioni">${I.gear}</button></header>
  <div class="stack">${modes.map(([k, t, s, ex]) => `<button class="mode" data-mode="${k}" aria-pressed="${ui.quizMode === k}"><span class="h"><span class="t">${t}</span>${ui.quizMode === k ? '<span class="pill p-review">scelto</span>' : ''}</span><span class="s">${s}</span>${ex ? `<span class="ex">${esc(ex)}</span>` : ''}</button>`).join('')}</div>
  <div class="card stack" style="gap:12px">
    <div class="set-row" style="padding:0;border:0"><span class="lbl">Domande</span><div class="seg">${[5,10,20].map(n => `<button data-qlen="${n}" aria-pressed="${ui.quizLen === n}">${n}</button>`).join('')}</div></div>
    <button class="big-btn" data-act="start-quiz">Inizia il quiz</button>
    <div class="muted" style="font-size:13px">Le domande pescano di più dalle parole che sbagli o che hai visto da poco. ${st.seen < ui.quizLen ? 'Finché ne hai viste poche, il quiz usa tutto il mazzo.' : ''}</div>
  </div>
  <h2 class="sec">Ultimi quiz ${st.acc !== null ? `<small>precisione 7 g: ${st.acc}%</small>` : ''}</h2>
  <div class="wlist">${hist.length ? hist.map(h => `<div class="witem"><div class="main"><div style="font-weight:600">${h.mode === 'mix' ? 'Misto' : QT[h.mode].name}</div><div class="it">${new Date(h.t).toLocaleDateString('it-IT', {day:'numeric', month:'short'})} · ${new Date(h.t).toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})}</div></div><div class="side"><span class="pill ${h.s / h.n >= .7 ? 'p-mastered' : 'p-learning'}">${h.s}/${h.n}</span></div></div>`).join('') : '<div class="empty">I risultati dei tuoi quiz compariranno qui.</div>'}</div>`;
}

/* ---------- Lessico ---------- */
function wordRow(o, side){
  return `<button class="witem" data-word="${o.w}"><div class="main"><div class="w">${o.w}<em>${POS_IT[o.pos]}</em></div><div class="it">${esc(o.it)}</div></div><div class="side">${side || pill(o.w)}<span class="nx">${nextLabel(o.w)}</span></div></button>`;
}
const FILTERS = [['all','Tutte'],['due','Da ripassare'],['new','Nuove'],['learning','In apprendimento'],['review','Consolidate'],['mastered','Padroneggiate'],['hard','Difficili']];
function filterWords(f, q){
  const hardSet = new Set(hardWords().map(o => o.w));
  q = (q || '').trim().toLowerCase();
  return WORDS.filter(o => {
    if (f === 'due' && !isDue(o.w)) return false;
    if (f === 'hard' && !hardSet.has(o.w)) return false;
    if (['new','learning','review','mastered'].includes(f) && level(o.w) !== f) return false;
    if (q && !(o.w.includes(q) || o.it.toLowerCase().includes(q) || o.syn.some(s => s.includes(q)))) return false;
    return true;
  }).sort((a,b) => a.w.localeCompare(b.w));
}
function lexList(){
  const list = filterWords(ui.filter, ui.q);
  return list.length ? list.map(o => wordRow(o)).join('') : `<div class="empty">Nessuna parola${ui.q ? ` per «${esc(ui.q)}»` : ' in questo gruppo'}.</div>`;
}
function renderLex(){
  return `
  <header class="top"><div><div class="eyebrow">${WORDS.length} parole ad alta frequenza</div><h1>Lessico</h1></div><button class="icon-btn" data-act="settings" aria-label="Impostazioni">${I.gear}</button></header>
  <label class="search">${I.search}<input id="q" type="search" placeholder="Cerca parola, sinonimo o traduzione" value="${esc(ui.q)}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <div class="chips">${FILTERS.map(([k, l]) => `<button class="chip" data-filter="${k}" aria-pressed="${ui.filter === k}">${l}<span class="n">${filterWords(k, '').length}</span></button>`).join('')}</div>
  <div class="wlist" id="lexlist">${lexList()}</div>`;
}
function bindSearch(){
  const i = $('#q'); if (!i) return;
  i.addEventListener('input', () => { ui.q = i.value; $('#lexlist').innerHTML = lexList(); });
}
function openWord(w){
  const o = BY[w], c = getC(w);
  openSheet(`
    <div class="sh-head"><div>${pill(w)}</div><button class="close" data-act="close-sheet" aria-label="Chiudi">${I.x}</button></div>
    <div class="back-like">
      <div class="pron" style="margin-bottom:-8px"><span class="resp">${o.resp}</span><span>${o.ipa}</span></div>
      ${backFace(o, true)}
    </div>
    <div class="kv">
      <div><span>Prossimo</span><b>${nextLabel(w)}</b></div>
      <div><span>Intervallo</span><b>${c.interval ? c.interval + ' g' : '—'}</b></div>
      <div><span>Errori</span><b>${c.lapses}</b></div>
      <div><span>Facilità</span><b>${c.seen ? c.ease.toFixed(1) : '—'}</b></div>
    </div>
    <div class="btn-row">
      <button class="big-btn" data-act="study-list" data-words="${w}">Ripassala ora</button>
      <button class="big-btn sec" data-act="quiz-session" data-words="${w}">Quiz su questa</button>
    </div>
    ${c.seen ? `<button class="danger" data-act="reset-word" data-w="${w}">Azzera i progressi di questa parola</button>` : ''}`);
}

/* ---------- Impostazioni ---------- */
function openSettings(){
  const s = S.settings;
  const seg = (k, vals, fmt = v => v) => `<div class="seg">${vals.map(v => `<button data-set="${k}" data-val="${v}" aria-pressed="${s[k] === v}">${fmt(v)}</button>`).join('')}</div>`;
  openSheet(`
    <div class="sh-head"><h3>Impostazioni</h3><button class="close" data-act="close-sheet" aria-label="Chiudi">${I.x}</button></div>
    <div>
      <div class="set-row"><span class="lbl">Obiettivo giornaliero</span><span class="hint">Risposte al giorno, tra flashcard e quiz.</span>${seg('goal', [10,20,30,50])}</div>
      <div class="set-row"><span class="lbl">Parole nuove al giorno</span><span class="hint">Più parole nuove oggi significano più ripassi nei prossimi giorni.</span>${seg('newPerDay', [5,10,15,20])}</div>
      <div class="set-row"><span class="lbl">Carte per sessione</span>${seg('sessionLen', [10,20,30])}</div>
      <div class="set-row"><div class="switch-row"><div><div class="lbl">Italiano sempre visibile</div><div class="hint">Se spento, la traduzione si apre con un tocco.</div></div><button class="switch" role="switch" data-act="toggle-it" aria-checked="${s.showIt}" aria-label="Italiano sempre visibile"></button></div></div>
      <div class="set-row"><span class="lbl">Pronuncia</span>${seg('voice', ['en-US','en-GB'], v => v === 'en-US' ? 'Americana' : 'Britannica')}</div>
      <div class="set-row"><span class="hint">I progressi restano salvati in questo browser, su questo dispositivo.</span><button class="danger" data-act="reset-all">Cancella tutti i progressi</button></div>
    </div>`);
}

/* ---------- Eventi ---------- */
let resetArm = null;
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-word]'); if (!t) return;
  const d = t.dataset;
  if (d.speak) { e.stopPropagation(); speak(d.speak); return; }
  if (d.tab) { ui.tab = d.tab; saveUi(); render(); window.scrollTo(0, 0); return; }
  if (d.info) { const [h, p] = INFO[d.info](); openSheet(`<div class="sh-head"><h3>${h}</h3><button class="close" data-act="close-sheet" aria-label="Chiudi">${I.x}</button></div><p style="margin:0;color:var(--fg2);font-size:15px;line-height:1.5">${p}</p>`); return; }
  if (d.rate) { rate(d.rate); return; }
  if (d.opt && qz) {
    const q = qz.qs[qz.i]; if (q.done) return;
    if (q.type === 'se') { q.sel = q.sel.includes(d.opt) ? q.sel.filter(x => x !== d.opt) : q.sel.length < 2 ? [...q.sel, d.opt] : q.sel; renderQ(); }
    else { q.sel = [d.opt]; answerQ(); }
    return;
  }
  if (d.filter) { ui.filter = d.filter; saveUi(); render(); return; }
  if (d.mode) { ui.quizMode = d.mode; saveUi(); render(); return; }
  if (d.qlen) { ui.quizLen = +d.qlen; saveUi(); render(); return; }
  if (d.set) { const v = isNaN(+d.val) ? d.val : +d.val; S.settings[d.set] = v; save(); render(); openSettings(); return; }
  if (d.word && !d.act) { openWord(d.word); return; }
  switch (d.act) {
    case 'settings': openSettings(); break;
    case 'close-sheet': closeSheet(); break;
    case 'start-normal': startStudy('normal'); break;
    case 'start-hard': startStudy('hard'); break;
    case 'start-more': startStudy('more'); break;
    case 'start-ahead': startStudy('ahead'); break;
    case 'study-list': $('#layer').innerHTML = ''; qz = null; startStudy('list', d.words.split(',')); break;
    case 'quiz-session': { const ws = d.words.split(',').filter(Boolean); $('#layer').innerHTML = ''; sess = null; startQuiz(ui.quizMode, Math.min(10, Math.max(ws.length, 1)), ws); break; }
    case 'flip': flip(); break;
    case 'show-it': sess ? (sess.showIt = true, $('#back').innerHTML = backFace(BY[sess.cur], true)) : null; break;
    case 'close-study': case 'close-quiz': closeOverlay(); break;
    case 'quick-quiz': startQuiz('mix', 5); break;
    case 'start-quiz': startQuiz(ui.quizMode, ui.quizLen); break;
    case 'q-check': answerQ(); break;
    case 'q-next': if (qz.i + 1 < qz.qs.length) { qz.i++; renderQ(); $('#qs').scrollTop = 0; } else finishQuiz(); break;
    case 'toggle-it': S.settings.showIt = !S.settings.showIt; save(); t.setAttribute('aria-checked', S.settings.showIt); break;
    case 'reset-word': delete S.cards[d.w]; save(); closeSheet(); render(); toast(`Progressi di «${d.w}» azzerati`); break;
    case 'reset-all':
      if (resetArm && Date.now() - resetArm < 4000) { S = defaults(); save(); resetArm = null; closeSheet(); render(); toast('Progressi cancellati'); }
      else { resetArm = Date.now(); t.textContent = 'Tocca di nuovo per cancellare tutto'; setTimeout(() => { if (t.isConnected) t.textContent = 'Cancella tutti i progressi'; }, 4000); }
      break;
  }
});
document.addEventListener('keydown', e => {
  if ($('#scrim') && e.key === 'Escape') return closeSheet();
  if (sess && $('#study')) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!sess.flipped) flip(); }
    else if (sess.flipped && ['1','2','3'].includes(e.key)) rate(['again','hard','easy'][+e.key - 1]);
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !sess && !qz) render(); });
render();
</script>

<script>if ('serviceWorker' in navigator) { addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }</script>
